<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-alt:#F7F8FB; --ink:#161A24; --ink-soft:#5B6272; --ink-faint:#9199AA;
  --line:#E3E6ED; --primary:#15239E; --primary-ink:#0D1970; --primary-tint:#EAEDFB; --accent:#0A87C4;
  --success:#1B8A5A; --success-bg:#E5F5EC; --warning:#B4780F; --warning-bg:#FBF0DA; --danger:#C43B3B; --danger-bg:#FBEAEA;
  --radius-sm:8px; --radius:12px; --radius-lg:16px; --shadow: 0 1px 2px rgba(20,23,34,.06), 0 1px 1px rgba(20,23,34,.04);
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1218; --surface:#171B24; --surface-alt:#1D2129; --ink:#EDEFF4; --ink-soft:#A7AEBD; --ink-faint:#6E7482;
    --line:#2A2F3A; --primary:#5C74FF; --primary-ink:#8C9CFF; --primary-tint:#1B2242; --accent:#37B1F0;
    --success:#3FC98A; --success-bg:#12291F; --warning:#E3A83B; --warning-bg:#332711; --danger:#F0716C; --danger-bg:#341717;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14.5px;line-height:1.45;}
h1,h2,h3{margin:0;}
button{font-family:var(--font-ui);cursor:pointer;}
input,select{font-family:var(--font-ui);}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.topbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:20;}
.brand-mark{width:32px;height:32px;border-radius:9px;object-fit:contain;background:#fff;flex-shrink:0;}
.topbar h1{font-size:15.5px;font-weight:700;}
.topbar .sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--warning);margin-left:auto;flex-shrink:0;}

.filter-bar{position:sticky;top:57px;background:var(--surface);z-index:19;padding:10px 14px 12px;border-bottom:1px solid var(--line);}
.wh-row{display:flex;gap:8px;margin-bottom:9px;}
.wh-row select{flex:1;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink);border-radius:var(--radius-sm);padding:9px 10px;font-size:13px;min-width:0;}
.wh-row select:disabled{opacity:.5;}
.store-search-wrap{position:relative;margin-bottom:9px;}
.store-search-wrap input{width:100%;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink);border-radius:var(--radius-sm);padding:9px 10px;font-size:13px;}
.store-search-wrap input:disabled{opacity:.5;}
.store-search-wrap input:focus{outline:none;border-color:var(--primary);}
.store-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow-y:auto;z-index:25;display:none;}
.store-results.show{display:block;}
.store-row{padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--line);cursor:pointer;}
.store-row:last-child{border-bottom:none;}
.store-row:active, .store-row:hover{background:var(--surface-alt);}
.store-row .r-name{font-weight:600;}
.store-row .r-dealer{font-size:10.8px;color:var(--ink-faint);margin-top:2px;}
.store-empty-note{padding:14px;text-align:center;color:var(--ink-faint);font-size:12px;}
.store-selected-card{display:none;align-items:center;gap:8px;border:1.5px solid var(--primary);background:var(--primary-tint);border-radius:var(--radius-sm);padding:9px 11px;margin-top:6px;}
.store-selected-card.show{display:flex;}
.store-selected-card .info{flex:1;min-width:0;}
.store-selected-card .code{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.store-selected-card .clear-btn{border:none;background:none;color:var(--ink-faint);font-size:17px;padding:2px 4px;line-height:1;flex-shrink:0;}
.bu-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:9px;-ms-overflow-style:none;scrollbar-width:none;}
.bu-chips::-webkit-scrollbar{display:none;}
.bu-chip{flex-shrink:0;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink-soft);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.bu-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.search-row input{width:100%;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink);border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;}
.search-row input:focus{outline:none;border-color:var(--primary);}
#purposeOtherWrap input{width:100%;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink);border-radius:var(--radius-sm);padding:9px 10px;font-size:13px;}
#purposeOtherWrap input:focus{outline:none;border-color:var(--primary);}


#browseContent{flex:1;padding:14px 14px 100px;}
.result-note{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;text-align:center;}

.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.product-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.product-img{width:100%;aspect-ratio:1/1;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.product-img img{width:100%;height:100%;object-fit:contain;background:#fff;opacity:0;transition:opacity .25s;}
.product-img img.loaded{opacity:1;}
.product-img .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.bu-tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:.02em;}
.product-body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1;}
.product-code{font-weight:700;font-size:12.5px;}
.product-desc{font-size:11px;color:var(--ink-soft);line-height:1.3;min-height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.product-avail{font-size:10.5px;color:var(--ink-faint);margin-top:auto;}
.product-avail.zero{color:var(--danger);}
.add-cart-btn{margin-top:6px;width:100%;border:1.5px solid var(--primary);background:var(--primary-tint);color:var(--primary-ink);border-radius:var(--radius-sm);padding:8px;font-size:12px;font-weight:700;}
.add-cart-btn.in-cart{background:var(--primary);color:#fff;}
.add-cart-btn:active{transform:scale(.97);}
.card-qty-row{display:flex;justify-content:center;margin-top:6px;}
.qty-stepper.sm{border-radius:16px;}
.qty-stepper.sm button{width:24px;height:24px;font-size:14px;}
.qty-stepper.sm input{width:38px;text-align:center;font-size:12px;font-weight:700;border:none;background:none;color:var(--ink);padding:0;-moz-appearance:textfield;}
.qty-stepper.sm input::-webkit-outer-spin-button, .qty-stepper.sm input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.qty-stepper.sm input:focus{outline:none;}

.empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* Floating cart button */
.cart-fab{position:fixed;right:18px;bottom:22px;z-index:30;background:var(--primary);color:#fff;border:none;border-radius:30px;padding:14px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(21,35,158,.35);font-size:14px;font-weight:700;max-width:480px;}
.cart-fab .badge{background:#fff;color:var(--primary-ink);border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.cart-fab.hidden{display:none;}

/* Cart overlay */
.cart-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;max-width:520px;margin:0 auto;}
.cart-overlay.show{display:flex;}
.cart-header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;}
.cart-header button{border:none;background:none;font-size:22px;color:var(--ink);padding:2px 6px;line-height:1;}
.cart-header h2{font-size:16px;}
.cart-body{flex:1;overflow-y:auto;padding:14px 16px 20px;}
.cart-item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;margin-bottom:9px;}
.cart-item .thumb{width:44px;height:44px;border-radius:8px;background:var(--surface-alt);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;}
.cart-item .thumb img{width:100%;height:100%;object-fit:contain;background:#fff;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .code{font-weight:700;font-size:12.5px;}
.cart-item .desc{font-size:10.8px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qty-stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.qty-stepper button{border:none;background:var(--surface-alt);color:var(--ink);width:26px;height:26px;font-size:15px;font-weight:700;line-height:1;}
.qty-stepper span{width:32px;text-align:center;font-size:12.5px;font-weight:700;}
.cart-item .remove-btn{border:none;background:none;color:var(--danger);font-size:18px;padding:4px 2px;line-height:1;}
.cart-empty{padding:60px 20px;text-align:center;color:var(--ink-faint);}

.checkout-summary{background:var(--primary-tint);color:var(--primary-ink);border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;margin-bottom:14px;line-height:1.6;}
.checkout-section{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
.checkout-section .field{margin-bottom:12px;}
.checkout-section label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.01em;}
.checkout-section input{width:100%;border:1.5px solid var(--line);background:var(--surface-alt);color:var(--ink);border-radius:var(--radius-sm);padding:12px 13px;font-size:15px;}
.checkout-section input:focus{outline:none;border-color:var(--primary);}

.cart-footer{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);}
.btn-submit{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);padding:15px;font-size:15px;font-weight:700;box-shadow:var(--shadow);}
.btn-submit:disabled{opacity:.5;}
.btn-submit:active{background:var(--primary-ink);}

.loading-wrap, .success-wrap, .error-wrap{padding:60px 24px;text-align:center;}
.loading-spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.success-icon{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;}
.success-wrap h2{font-size:18px;margin-bottom:8px;}
.success-wrap p{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;}
.success-summary{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;font-size:12.5px;margin-bottom:20px;max-height:220px;overflow-y:auto;}
.success-summary .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);}
.success-summary .row:last-child{border-bottom:none;}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--primary-tint);color:var(--primary-ink);padding:11px 13px;border-radius:var(--radius-sm);font-size:11.8px;margin-bottom:14px;}
</style>
</head>

const BU_LABELS = {AC:'Air Conditioner', AV:'AV / TV / Audio', HA:'Home Appliances'};
const BU_PALETTE = ['#15239E','#7B3FE4','#0A87C4','#B4780F','#1B8A5A','#C43B3B','#0D1970','#8C4B2A'];
function buLabel(bu){ return BU_LABELS[bu] || bu; }
function buColor(bu){
  const keys = Object.keys(BU_LABELS);
  let idx = keys.indexOf(bu);
  if(idx<0){ idx = Math.abs([...(bu||'')].reduce((s,c)=>s+c.charCodeAt(0),0)) % BU_PALETTE.length; }
  return BU_PALETTE[idx % BU_PALETTE.length];
}
const WAREHOUSES = Object.keys(ORG_META.warehouseRegion).map(name=>({id:name, name, region:ORG_META.warehouseRegion[name]}));
let TS_LIST = [];   // dynamic, from server: [{id, name, region}]
let STORE_LIST = []; // dynamic, from server: [{id, name, tsId, region, dealer}]
function findStoreEntry(storeName){
  const s = STORE_LIST.find(x=>x.name===storeName);
  if(!s) return null;
  const t = TS_LIST.find(x=>x.id===s.tsId);
  return {region: s.region, ts: t?t.name:'', store: s.name, dealer: s.dealer};
}
function initialsOf(code){ return (code||'').slice(0,2).toUpperCase(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr,n){ const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,10); }

/* ============================= REMOTE DATA / STATE ============================= */
let POSM = [];          // [{code, desc, type, bu, status}]
let INVENTORY = [];      // [{warehouseId, posmCode, qty}]
const imageCache = {};   // code -> dataUrl, filled lazily via getImages
let cart = [];            // [{code, qty}]

let selectedRegion = null;
function warehousesInRegion(region){ return WAREHOUSES.filter(w=>w.region===region); }
function tsInRegion(region){ return TS_LIST.filter(t=>t.region===region).map(t=>t.name).sort(); }
function storesForTs(tsName){
  const t = TS_LIST.find(x=>x.name===tsName);
  if(!t) return [];
  return STORE_LIST.filter(s=>s.tsId===t.id).map(s=>s.name).sort();
}

function invRow(whId, code){ return INVENTORY.find(r=>r.warehouseId===whId && r.posmCode===code); }
function qtyFor(whId, code){ const r = invRow(whId, code); return r ? r.qty : 0; }
function posmByCode(code){ return POSM.find(p=>p.code===code); }

async function loadFormData(){
  const res = await fetch(APPS_SCRIPT_URL + '?action=getFormData&t=' + Date.now(), {redirect:'follow'});
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  POSM = data.posmMaster.filter(p=>p.status==='active');
  INVENTORY = data.inventory;
  TS_LIST = data.tradeSupervisors || [];
  STORE_LIST = data.stores || [];
}
async function postAction(action, payload){
  const body = Object.assign({action}, payload);
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body), redirect:'follow'
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || 'Unknown server error');
  return json;
}
async function loadImagesFor(codes){
  const uncached = [...new Set(codes)].filter(c => !(c in imageCache)).slice(0,60);
  if(!uncached.length) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL+'?action=getImages&codes='+encodeURIComponent(uncached.join(','))+'&t='+Date.now(), {redirect:'follow'});
    const data = await res.json();
    Object.entries(data.results||{}).forEach(([code,src])=>{
      imageCache[code] = src;
      const img = document.querySelector(`.product-card[data-code="${cssEscape(code)}"] img`);
      if(img){ img.src = src; img.classList.add('loaded'); const ph = img.parentElement.querySelector('.ph'); if(ph) ph.style.display='none'; }
      const thumbImg = document.querySelector(`.cart-item[data-code="${cssEscape(code)}"] .thumb img`);
      if(thumbImg){ thumbImg.src = src; thumbImg.style.display=''; const ph2 = thumbImg.parentElement.querySelector('.ph'); if(ph2) ph2.style.display='none'; }
    });
  }catch(e){ /* keep placeholders, non-fatal */ }
}
function cssEscape(s){ return String(s).replace(/["\\]/g,'\\$&'); }

/* ============================= CART HELPERS ============================= */
function cartQtyFor(code){ const it = cart.find(c=>c.code===code); return it ? it.qty : 0; }
function addToCart(code, delta){
  let it = cart.find(c=>c.code===code);
  if(!it){ it = {code, qty:0}; cart.push(it); }
  it.qty = Math.max(0, it.qty + delta);
  if(it.qty === 0) cart = cart.filter(c=>c.code!==code);
  updateCartFab();
}
function removeFromCart(code){ cart = cart.filter(c=>c.code!==code); updateCartFab(); }
function updateCartFab(){
  const fab = document.getElementById('cartFab');
  const badge = document.getElementById('cartBadge');
  badge.textContent = cart.length;
  fab.classList.toggle('hidden', cart.length===0);
}

function matchingPosm(){
  const q = searchQuery.trim().toLowerCase();
  return POSM.filter(p=>{
    if(currentBU!=='all' && p.bu!==currentBU) return false;
    if(q && !(p.code.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q))) return false;
    // Only show POSM with actual stock at the selected warehouse — absence
    // from the list itself signals "nothing to request here right now".
    if(qtyFor(selectedWarehouseId, p.code) <= 0) return false;
    return true;
  });
}
function renderFilterBar(){

  const regionSelect = document.getElementById('regionSelect');

  regionSelect.value = selectedRegion || '';

  function repopulateWarehouse(){
    const whSelect = document.getElementById('whSelect');
    if(!selectedRegion){
      whSelect.innerHTML = `<option value="">— Select Region first —</option>`;
      whSelect.disabled = true;
      return;
    }
    const whs = warehousesInRegion(selectedRegion);
    whSelect.disabled = false;

  }
  function repopulateTs(){
    const tsSelect = document.getElementById('tsSelect');
    if(!selectedRegion){
      tsSelect.innerHTML = `<option value="">— Select Region first —</option>`;
      tsSelect.disabled = true;
      return;
    }
    const tsList = tsInRegion(selectedRegion);
    tsSelect.disabled = false;

    tsSelect.value = selectedTs || '';
  }
  function resetStorePicker(){
    const input = document.getElementById('storeSearchInput');
    const card = document.getElementById('storeSelectedCard');
    document.getElementById('storeResults').classList.remove('show');
    if(!selectedTs){
      input.value = ''; input.disabled = true; input.placeholder = 'Select a TS first';
      card.classList.remove('show');
      return;
    }
    input.disabled = false;
    input.placeholder = `Search ${selectedTs}'s stores...`;
    if(selectedStore){
      card.classList.add('show');
      document.getElementById('storeSelectedName').textContent = selectedStore;
      input.value = '';
    } else {
      card.classList.remove('show');
    }
  }
  function repopulatePurpose(){
    const purposeSelect = document.getElementById('purposeSelect');
    purposeSelect.innerHTML = `<option value="">— Select Purpose —</option>` + PURPOSE_OPTIONS.map(p=>`<option value="${p}">${p}</option>`).join('');
    purposeSelect.value = selectedPurpose || '';
    const otherWrap = document.getElementById('purposeOtherWrap');
    otherWrap.style.display = (selectedPurpose==='Others') ? '' : 'none';
    document.getElementById('purposeOtherInput').value = purposeOtherText;
  }

  repopulateWarehouse(); repopulateTs(); resetStorePicker(); repopulatePurpose();

  regionSelect.addEventListener('change', ()=>{
    selectedRegion = regionSelect.value || null;
    selectedWarehouseId = null; selectedTs = null; selectedStore = null;
    repopulateWarehouse(); repopulateTs(); resetStorePicker();
    renderBrowse();
  });
  document.getElementById('whSelect').addEventListener('change', (e)=>{ selectedWarehouseId = e.target.value || null; renderBrowse(); });
  document.getElementById('tsSelect').addEventListener('change', (e)=>{
    selectedTs = e.target.value || null;
    selectedStore = null;
    resetStorePicker();
  });
  document.getElementById('purposeSelect').addEventListener('change', (e)=>{
    selectedPurpose = e.target.value || null;
    document.getElementById('purposeOtherWrap').style.display = (selectedPurpose==='Others') ? '' : 'none';
    if(document.getElementById('cartOverlay').classList.contains('show')) updateCheckoutState();
  });
  document.getElementById('purposeOtherInput').addEventListener('input', (e)=>{
    purposeOtherText = e.target.value;
    if(document.getElementById('cartOverlay').classList.contains('show')) updateCheckoutState();
  });

  wireStorePicker();

  const buList = ['all', ...Object.keys(BU_LABELS)];
  const chips = document.getElementById('buChips');
  chips.innerHTML = buList.map(bu=>`<button class="bu-chip ${bu===currentBU?'active':''}" data-bu="${bu}">${bu==='all'?'All':buLabel(bu)}</button>`).join('');
  chips.querySelectorAll('[data-bu]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentBU = btn.dataset.bu;
      chips.querySelectorAll('[data-bu]').forEach(b=>b.classList.toggle('active', b.dataset.bu===currentBU));
      renderBrowse();
    });
  });

  const search = document.getElementById('searchInput');
  search.value = searchQuery;
  search.addEventListener('input', ()=>{ searchQuery = search.value; renderBrowse(); });
}

function wireStorePicker(){
  const input = document.getElementById('storeSearchInput');
  const results = document.getElementById('storeResults');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!selectedTs){ results.classList.remove('show'); return; }
    if(q.length < 1){ results.classList.remove('show'); results.innerHTML=''; return; }
    const stores = storesForTs(selectedTs).filter(s=>s.toLowerCase().includes(q)).slice(0, STORE_RESULT_CAP);
    results.innerHTML = stores.length ? stores.map(s=>{
      const entry = findStoreEntry(s);
      return `<div class="store-row" data-store="${s.replace(/"/g,'&quot;')}"><div class="r-name">${s}</div>${entry?`<div class="r-dealer">${entry.dealer}</div>`:''}</div>`;
    }).join('') : `<div class="store-empty-note">No matching stores found</div>`;
    results.classList.add('show');
    results.querySelectorAll('[data-store]').forEach(row=>{
      row.addEventListener('click', ()=>{
        selectedStore = row.dataset.store;
        results.classList.remove('show'); results.innerHTML='';
        document.getElementById('storeSelectedCard').classList.add('show');
        document.getElementById('storeSelectedName').textContent = selectedStore;
        input.value = '';
      });
    });
  });
  document.getElementById('storeClearBtn').addEventListener('click', ()=>{
    selectedStore = null;
    document.getElementById('storeSelectedCard').classList.remove('show');
  });
}

function renderBrowse(){
  const box = document.getElementById('browseContent');

  if(!selectedRegion || !selectedWarehouseId){
    box.innerHTML = `<div class="empty-state">📍 Please select a Region and Warehouse above to see available POSM.</div>`;
    return;
  }

  const all = matchingPosm();
  const shown = all.slice(0, GRID_CAP);

  if(!all.length){
    box.innerHTML = `<div class="empty-state">No matching POSM here (or no stock at this warehouse). Try a different filter or search term.</div>`;
    return;
  }

  box.innerHTML = `
    ${all.length > GRID_CAP ? `<div class="result-note">Showing the first ${GRID_CAP} of ${all.length} — search to narrow it down further.</div>` : ''}
    <div class="product-grid">
      ${shown.map(p=>{
        const avail = qtyFor(selectedWarehouseId, p.code);
        const inCart = cartQtyFor(p.code);
        const cached = imageCache[p.code];
        return `<div class="product-card" data-code="${p.code}">
          <div class="product-img">
            <span class="bu-tag">${p.bu}</span>
            ${cached ? `<img class="loaded" src="${cached}" loading="lazy">` : `<img loading="lazy"><div class="ph" style="background:${buColor(p.bu)}">${initialsOf(p.code)}</div>`}
          </div>
          <div class="product-body">
            <div class="product-code">${p.code}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-avail ${avail===0?'zero':''}">Available: ${avail.toLocaleString()}</div>
            <div class="card-qty-row">
              <div class="qty-stepper sm">
                <button type="button" data-cardqtydec="${p.code}">&minus;</button>
                <input type="number" min="1" max="${avail}" value="1" data-cardqty="${p.code}">
                <button type="button" data-cardqtyinc="${p.code}">+</button>
              </div>
            </div>
            <button class="add-cart-btn ${inCart?'in-cart':''}" data-add="${p.code}">${inCart ? `In Cart (${inCart}) · Add more` : '+ Add to Cart'}</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  box.querySelectorAll('[data-cardqtyinc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = box.querySelector(`[data-cardqty="${cssEscape(btn.dataset.cardqtyinc)}"]`);
      inp.value = Math.max(1, (parseInt(inp.value||'1',10)||1) + 1);
    });
  });
  box.querySelectorAll('[data-cardqtydec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = box.querySelector(`[data-cardqty="${cssEscape(btn.dataset.cardqtydec)}"]`);
      inp.value = Math.max(1, (parseInt(inp.value||'1',10)||1) - 1);
    });
  });
  box.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.dataset.add;
      const inp = box.querySelector(`[data-cardqty="${cssEscape(code)}"]`);
      const qty = Math.max(1, parseInt(inp.value||'1',10)||1);
      addToCart(code, qty);
      renderBrowse();
    });
  });
  loadImagesFor(shown.map(p=>p.code));
}

/* ============================= CART VIEW ============================= */
function openCart(){
  document.getElementById('cartOverlay').classList.add('show');
  renderCart();
}
function closeCart(){ document.getElementById('cartOverlay').classList.remove('show'); }

function renderCart(){
  const body = document.getElementById('cartBody');
  if(!cart.length){
    body.innerHTML = `<div class="cart-empty">Your cart is empty.<br>Go back to Browse to add POSM.</div>`;
    document.getElementById('cartSubmitBtn').disabled = true;
    return;
  }
  const wh = WAREHOUSES.find(w=>w.id===selectedWarehouseId);
  body.innerHTML = `
    <div class="checkout-summary">
      <div>📍 <b>${selectedRegion}</b> · ${wh?wh.name:selectedWarehouseId}</div>
      <div>👤 <b>${selectedTs||'—'}</b> → ${selectedStore||'—'}</div>
      <div>🎯 ${selectedPurpose ? (selectedPurpose==='Others' ? `Others${purposeOtherText.trim()?': '+purposeOtherText.trim():''}` : selectedPurpose) : '— Purpose not set —'}</div>
    </div>
    ${cart.map(item=>{
      const p = posmByCode(item.code);
      const cached = imageCache[item.code];
      const avail = qtyFor(selectedWarehouseId, item.code);
      return `<div class="cart-item" data-code="${item.code}">
        <div class="thumb" style="background:${buColor(p?p.bu:'')}">
          ${cached ? `<img src="${cached}">` : `<img style="display:none;"><span class="ph">${initialsOf(item.code)}</span>`}
        </div>
        <div class="info">
          <div class="code">${item.code}</div>
          <div class="desc">${p?p.desc:''} · avail: ${avail}</div>
        </div>
        <div class="qty-stepper">
          <button data-dec="${item.code}">&minus;</button>
          <span>${item.qty}</span>
          <button data-inc="${item.code}">+</button>
        </div>
        <button class="remove-btn" data-remove="${item.code}">&times;</button>
      </div>`;
    }).join('')}
  `;
  body.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{ addToCart(b.dataset.inc, 1); renderCart(); }));
  body.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{ addToCart(b.dataset.dec, -1); renderCart(); }));
  body.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>{ removeFromCart(b.dataset.remove); renderCart(); }));

  loadImagesFor(cart.map(c=>c.code));
  updateCheckoutState();
}
function updateCheckoutState(){
  const btn = document.getElementById('cartSubmitBtn');
  const purposeReady = selectedPurpose && (selectedPurpose!=='Others' || purposeOtherText.trim());
  const ready = cart.length>0 && !!selectedTs && !!selectedStore && !!purposeReady;
  btn.disabled = !ready;
  btn.textContent = ready ? `Submit ${cart.length} item${cart.length>1?'s':''}`
    : (!cart.length ? 'Cart is empty' : (!selectedTs || !selectedStore) ? 'TS and Store required' : 'Purpose required');
}

document.getElementById('cartFab').addEventListener('click', openCart);
document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
document.getElementById('cartSubmitBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('cartSubmitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  const created = todayStr();
  const store = selectedStore || '';
  const ts = selectedTs || '';
  const purpose = selectedPurpose==='Others' ? `Others: ${purposeOtherText.trim()}` : (selectedPurpose||'');
  const items = cart.map(c=>({id:uid('REQ'), posmCode:c.code, qty:c.qty}));
  try{
    await postAction('newRequestBatch', {
      store, ts, warehouseId: selectedWarehouseId, dateCreated: created, dueDate: addDays(created,5),
      createdBy: ts, purpose, items
    });
    renderSuccess({store, ts, purpose, warehouseId: selectedWarehouseId, items});
  }catch(e){
    btn.disabled = false; updateCheckoutState();
    alert('Could not submit the cart. Please try again.\n\n' + e.message);
  }
});

/* ============================= SUCCESS / ERROR / BOOT ============================= */
function renderSuccess(order){
  closeCart();
  const wh = WAREHOUSES.find(w=>w.id===order.warehouseId);
  document.getElementById('filterBar').style.display = 'none';
  document.getElementById('cartFab').classList.add('hidden');
  document.getElementById('browseContent').innerHTML = `
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <h2>${order.items.length} item(s) submitted!</h2>
      <p>Your request(s) are now in "For Sorting" in the inventory tool.</p>
      <div class="success-summary">
        ${order.items.map(it=>{ const p = posmByCode(it.posmCode); return `<div class="row"><span>${it.posmCode} — ${p?p.desc:''}</span><b>${it.qty}</b></div>`; }).join('')}
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:18px;text-align:left;">
        <b>Store:</b> ${order.store}<br><b>Trade Supervisor:</b> ${order.ts}<br><b>Warehouse:</b> ${wh?wh.name:order.warehouseId}<br><b>Purpose:</b> ${order.purpose}
      </div>
      <button class="btn-submit" id="newOrderBtn">+ New Request</button>
    </div>
  `;
  document.getElementById('newOrderBtn').addEventListener('click', async ()=>{
    cart = []; // keep region/warehouse/TS/store as-is — usually the same for the next request too
    document.getElementById('filterBar').style.display = '';
    updateCartFab();
    renderBrowse();
    setSyncDot('var(--warning)');
    try{ await loadFormData(); setSyncDot('var(--success)'); renderBrowse(); }catch(e){ setSyncDot('var(--danger)'); }
  });
}
function setSyncDot(color){ const d = document.getElementById('syncDot'); if(d) d.style.background = color; }
function renderError(message){
  document.getElementById('browseContent').innerHTML = `
    <div class="error-wrap">
      <div class="success-icon" style="background:var(--danger-bg);color:var(--danger);">!</div>
      <h2>Could not load data</h2>
      <p style="color:var(--ink-soft);font-size:13px;">${message}</p>
      <button class="btn-submit" id="retryBtn">Try Again</button>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', boot);
}
async function boot(){
  if(!APPS_SCRIPT_URL){ renderError('No Apps Script URL is configured. Refresh the page and enter the URL.'); return; }
  document.getElementById('browseContent').innerHTML = `<div class="loading-wrap"><div class="loading-spinner"></div><div style="color:var(--ink-faint);font-size:13px;">Loading POSM data...</div></div>`;
  setSyncDot('var(--warning)');
  try{
    await loadFormData();
    setSyncDot('var(--success)');
    renderFilterBar();
    renderBrowse();
  }catch(e){
    setSyncDot('var(--danger)');
    renderError(e.message || 'Could not reach the server.');
  }
}
boot();
</script>
</body>
</html>
